name: indexnow

# Tells IndexNow (Bing, Yandex, Seznam, Naver) about new or changed pages on
# https://www.shahidali.co. It reads only the live sitemap, so it needs none
# of the site's source code. Runs every 3 hours and on demand.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Announced state (url -> lastmod). A new key per run so the latest
      # state is always saved; restore-keys picks up the most recent one.
      - uses: actions/cache@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-
      - run: node indexnow.mjs
        env:
          STATE_PATH: ${{ github.workspace }}/.indexnow-state.json
