name: indexnow

# Tells IndexNow (Bing, Yandex, Seznam, Naver) about new or changed pages on
# Shahid's sites that have no deploy-time ping of their own (shahidali.co,
# aniimoindex.com). It reads only each live sitemap, so it needs no site code. Runs every 3 hours and on demand.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Announced state (url -> lastmod). A new key per run so the latest
      # state is always saved; restore-keys picks up the most recent one.
      - uses: actions/cache@v4
        with:
          path: |
            .indexnow-state.json
            .indexnow-state-aniimoindex.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-
      - name: shahidali.co
        run: node indexnow.mjs
        env:
          STATE_PATH: ${{ github.workspace }}/.indexnow-state.json
      - name: aniimoindex.com
        run: node indexnow.mjs
        env:
          SITE_HOST: aniimoindex.com
          SITE_KEY: fcd243846b51df9c03eb9e33a5048553
          SITE_SITEMAP: https://aniimoindex.com/sitemap.xml
          STATE_PATH: ${{ github.workspace }}/.indexnow-state-aniimoindex.json
