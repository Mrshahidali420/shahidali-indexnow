name: indexnow

# Tells IndexNow (Bing, Yandex, Seznam, Naver) about new or changed pages on
# Shahid's sites. gta6record and manhwaindex also ping from their own deploys;
# this is a second, scheduled safety net for them. Reads only live sitemaps. Runs every 3 hours and on demand.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Announced state (url -> lastmod). A new key per run so the latest
      # state is always saved; restore-keys picks up the most recent one.
      - uses: actions/cache@v4
        with:
          path: |
            .indexnow-state.json
            .indexnow-state-aniimoindex.json
            .indexnow-state-gta6record.json
            .indexnow-state-manhwaindex.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-
      - name: shahidali.co
        run: node indexnow.mjs
        env:
          STATE_PATH: ${{ github.workspace }}/.indexnow-state.json
      - name: aniimoindex.com
        run: node indexnow.mjs
        env:
          SITE_HOST: aniimoindex.com
          SITE_KEY: fcd243846b51df9c03eb9e33a5048553
          SITE_SITEMAP: https://aniimoindex.com/sitemap.xml
          STATE_PATH: ${{ github.workspace }}/.indexnow-state-aniimoindex.json
      - name: gta6record.com
        run: node indexnow.mjs
        env:
          SITE_HOST: gta6record.com
          SITE_KEY: 9ce5adc7d2b0607db3a4e84d14e85185
          SEED_IF_EMPTY: '1'
          STATE_PATH: ${{ github.workspace }}/.indexnow-state-gta6record.json
      - name: manhwaindex.com
        run: node indexnow.mjs
        env:
          SITE_HOST: manhwaindex.com
          SITE_KEY: 368b5571dfe5413a9a435c04fac12b49
          SITE_SITEMAP: https://manhwaindex.com/sitemap.xml
          SEED_IF_EMPTY: '1'
          STATE_PATH: ${{ github.workspace }}/.indexnow-state-manhwaindex.json
